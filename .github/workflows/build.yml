name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
        pip install --upgrade buildozer "cython<3.0.0"

    - name: Setup Android SDK Tools and Licenses
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$SDK_DIR/cmdline-tools"

        # تحميل وتفكيك commandlinetools الرسمية
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline.zip
        unzip -q cmdline.zip -d "$SDK_DIR/cmdline-tools"
        mv "$SDK_DIR/cmdline-tools/cmdline-tools" "$SDK_DIR/cmdline-tools/latest"
        rm cmdline.zip

        # ربط المسار القديم بالجديد لحل مشكلة sdkmanager path does not exist
        mkdir -p "$SDK_DIR/tools/bin"
        ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"

        # قبول التراخيص أوتوماتيكياً
        yes | "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_DIR" --licenses || true

    - name: Configure buildozer.spec
      run: |
        python3 -c "
        import re

        with open('buildozer.spec', 'r') as f:
            content = f.read()

        def set_config(key, val, text):
            pattern = r'#?\s*' + re.escape(key) + r'\s*=.*'
            if re.search(pattern, text):
                return re.sub(pattern, f'{key} = {val}', text)
            else:
                return text + f'\n{key} = {val}\n'

        content = set_config('android.accept_sdk_license', 'True', content)
        content = set_config('android.api', '33', content)
        content = set_config('android.minapi', '24', content)
        content = set_config('android.ndk', '25b', content)
        content = set_config('android.build_tools_version', '34.0.0', content)

        with open('buildozer.spec', 'w') as f:
            f.write(content)
        "

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DateConverter-APK
        path: bin/*.apk
