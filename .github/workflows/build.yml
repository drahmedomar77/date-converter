name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Configure buildozer.spec and Licenses
      run: |
        # 1. قبول تراخيص Android SDK بالكامل
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        if [ -d "$ANDROID_HOME/licenses" ]; then
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/
        fi

        # 2. ضبط buildozer.spec لاستخدام إصدار مستقر 34.0.0 وتفعيل قبول التراخيص
        python3 -c "
        import re
        with open('buildozer.spec', 'r') as f:
            content = f.read()

        content = re.sub(r'#?\s*android\.accept_sdk_license\s*=.*', 'android.accept_sdk_license = True', content)
        content = re.sub(r'#?\s*android\.build_tools_version\s*=.*', 'android.build_tools_version = 34.0.0', content)
        content = re.sub(r'#?\s*android\.api\s*=.*', 'android.api = 33', content)

        with open('buildozer.spec', 'w') as f:
            f.write(content)
        "

    - name: Build APK
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DateConverter-APK
        path: bin/*.apk
