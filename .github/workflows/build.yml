name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Pre-accept Android SDK Licenses & Build APK
      run: |
        # إنشاء مجلد التراخيص لـ Buildozer ونقل التراخيص المقبولة جاهزاً من خادم GitHub
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        if [ -d "$ANDROID_HOME/licenses" ]; then
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/
        fi

        # قبول كلي إضافي للتراخيص عبر sdkmanager
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # تشغيل البناء الفعلي مع إظهار تفاصيل السجل
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DateConverter-APK
        path: bin/*.apk
        
