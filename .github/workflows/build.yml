name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Configure buildozer.spec and Build APK
      run: |
        # 1. قبول كافة تراخيص Android SDK المدمجة في الخادم
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

        # 2. ربط Buildozer بـ SDK الخادم المدمج تلقائياً
        python3 -c "
        with open('buildozer.spec', 'r') as f:
            lines = f.readlines()

        new_lines = []
        has_sdk, has_lic = False, False

        for line in lines:
            s = line.strip()
            if s.startswith(('android.sdk_path', '#android.sdk_path', '# android.sdk_path')):
                new_lines.append('android.sdk_path = /usr/local/lib/android/sdk\n')
                has_sdk = True
            elif s.startswith(('android.accept_sdk_license', '#android.accept_sdk_license', '# android.accept_sdk_license')):
                new_lines.append('android.accept_sdk_license = True\n')
                has_lic = True
            else:
                new_lines.append(line)

        if not has_sdk:
            new_lines.append('android.sdk_path = /usr/local/lib/android/sdk\n')
        if not has_lic:
            new_lines.append('android.accept_sdk_license = True\n')

        with open('buildozer.spec', 'w') as f:
            f.writelines(new_lines)
        "

        # 3. بدء عملية بناء الـ APK
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DateConverter-APK
        path: bin/*.apk
