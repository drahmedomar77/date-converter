name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev expect
        pip install --upgrade buildozer cython

    - name: Build APK with Auto License Acceptance
      run: |
        rm -rf ~/.buildozer
        expect -c '
          set timeout -1
          spawn buildozer --warn_on_root=0 android debug
          expect {
            "Accept? (y/N):" { send "y\r"; exp_continue }
            "y/N" { send "y\r"; exp_continue }
            eof
          }
        '

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DateConverter-APK
        path: bin/*.apk
        
