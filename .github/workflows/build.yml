name: Build Kivy APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libffi-dev libssl-dev
        pip install --upgrade buildozer cython

    - name: Setup Android SDK Tools and Licenses
      run: |
        # 1. إنشاء المسارات المطلوبة
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools

        # 2. تحميل أدوات Android CLI الرسمية وتفكيكها
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
        unzip -q cmdline-tools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        rm cmdline-tools.zip

        # 3. إنشاء اختصار للتوافق مع الإصدارات المختلفة
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager

        # 4. نقل التراخيص المعتمدة مسبقاً
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        if [ -d "$ANDROID_HOME/licenses" ]; then
          cp -r $ANDROID_HOME/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/
        fi

        # 5. تأكيد واستكمال التراخيص أوتوماتيكياً
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Configure buildozer.spec
      run: |
        python3 -c "
        import re

        with open('buildozer.spec', 'r') as f:
            content = f.read()

        def set_config(key, val, text):
            pattern = r'#?\s*' + re.escape(key) + r'\s*=.*'
            if re.search(pattern, text):
                return re.sub(pattern, f'{key} = {val}', text)
            else:
                return text + f'\n{key} = {val}\n'

        content = set_config('android.accept_sdk_license', 'True', content)
        content = set_config('android.api', '33', content)
        content = set_config('android.minapi', '24', content)

        with open('buildozer.spec', 'w') as f:
            f.write(content)
        "

    - name: Build APK with Buildozer
      run: |
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DateConverter-APK
        path: bin/*.apk
